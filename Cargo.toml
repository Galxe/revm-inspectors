[package]
name = "revm-inspectors"
description = "Revm inspector implementations"
version = "0.40.1"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/revm-inspectors"
repository = "https://github.com/paradigmxyz/revm-inspectors"
categories = ["cryptography"]
keywords = ["ethereum", "evm", "inspectors", "tracing", "debugging"]
exclude = [
    ".github",
    "scripts",
    "testdata",
    "tests",
    "cliff.toml",
    "deny.toml",
    "release.toml",
]

[lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = "deny"
rustdoc.all = "warn"
clippy.lint_groups_priority = "allow"

[dependencies]
# eth
alloy-rpc-types-eth = { version = "2.0", default-features = false }
alloy-rpc-types-trace = { version = "2.0", default-features = false }
alloy-sol-types = { version = "1.4", default-features = false }
alloy-primitives = { version = "1.4", default-features = false, features = [
    "map",
] }
revm = { version = "40.0.0", default-features = false }

anstyle = { version = "1.0", optional = true }
colorchoice = "1.0"
thiserror = { version = "2.0", default-features = false }

# serde
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# js-tracer
boa_engine = { version = "0.21", optional = true }
boa_gc = { version = "0.21", optional = true }

[dev-dependencies]
alloy-hardforks = "0.4"
criterion = "0.8"
snapbox = { version = "1.2", features = ["term-svg"] }

[[bench]]
name = "js_tracer"
path = "benches/js_tracer.rs"
harness = false

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "anstyle/std",
    "serde/std",
    "serde_json/std",
    "revm/std",
    "thiserror/std",
]
serde = ["dep:serde", "revm/serde"]
js-tracer = ["dep:boa_engine", "dep:boa_gc"]

[patch.crates-io]
# gravity-forked revm
revm = { path = "/home/neko/gravity/revm/crates/revm" }
revm-bytecode = { path = "/home/neko/gravity/revm/crates/bytecode" }
revm-context = { path = "/home/neko/gravity/revm/crates/context" }
revm-context-interface = { path = "/home/neko/gravity/revm/crates/context/interface" }
revm-database = { path = "/home/neko/gravity/revm/crates/database" }
revm-database-interface = { path = "/home/neko/gravity/revm/crates/database/interface" }
revm-handler = { path = "/home/neko/gravity/revm/crates/handler" }
revm-inspector = { path = "/home/neko/gravity/revm/crates/inspector" }
revm-interpreter = { path = "/home/neko/gravity/revm/crates/interpreter" }
revm-precompile = { path = "/home/neko/gravity/revm/crates/precompile" }
revm-primitives = { path = "/home/neko/gravity/revm/crates/primitives" }
revm-state = { path = "/home/neko/gravity/revm/crates/state" }
